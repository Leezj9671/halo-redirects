apiVersion: v1alpha1
kind: Setting
metadata:
  name: redirects-settings
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: radio
          name: enabled
          id: enabled
          label: 启用重定向
          help: 规则在本插件的「规则管理」标签页中维护（新增、批量粘贴、导入导出 CSV、测试地址）。
          value: true
          options:
            - label: 启用
              value: true
            - label: 关闭
              value: false
        - $formkit: radio
          name: preserveQueryString
          id: preserveQueryString
          label: 保留原请求查询参数
          help: 如果原链接包含 ?utm_source=... 之类的参数，会自动拼接到目标地址
          value: true
          options:
            - label: 保留
              value: true
            - label: 不保留
              value: false
