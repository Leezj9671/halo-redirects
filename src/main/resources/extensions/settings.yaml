apiVersion: v1alpha1
kind: Setting
metadata:
  name: redirects-settings
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: radio
          name: enabled
          id: enabled
          label: 启用重定向
          value: true
          options:
            - label: 启用
              value: true
            - label: 关闭
              value: false
        - $formkit: radio
          name: preserveQueryString
          id: preserveQueryString
          label: 保留原请求查询参数
          help: 如果原链接包含 ?utm_source=... 之类的参数，会自动拼接到目标地址
          value: true
          options:
            - label: 保留
              value: true
            - label: 不保留
              value: false
        - $formkit: textarea
          name: bulkRules
          id: bulkRules
          label: 批量粘贴规则
          help: 每行一条，格式见输入框示例；状态码默认 301，# 开头为注释。与下方规则来源路径相同时，以下方为准。
          rows: 6
          placeholder: |
            # 来源 -> 目标 [-> 状态码] [-> DIRECTORY]
            /old-post -> /new-post
            /docs/legacy -> https://example.com/docs -> 302
            /docs -> /knowledge -> 301 -> DIRECTORY
            /deleted-post -> 410
            # 也可用逗号：来源,目标,状态码,备注,匹配方式
            /campaign,/landing,302,活动页
        - $formkit: repeater
          name: rules
          label: 重定向规则
          help: 目录匹配会把子路径一并带到目标，例如 /docs/a -> /knowledge/a。目标支持站内路径或完整 URL。
          addLabel: 添加规则
          value: []
          children:
            - $formkit: text
              name: fromPath
              label: 来源路径
              validation: required
              placeholder: /old-post
            - $formkit: text
              name: toPath
              label: 目标地址
              help: 状态码为 410 时留空
              placeholder: /new-post 或 https://example.com/page
            - $formkit: select
              name: matchType
              label: 匹配方式
              value: EXACT
              options:
                - label: 精确匹配
                  value: EXACT
                - label: 目录匹配（保留子路径）
                  value: DIRECTORY
            - $formkit: select
              name: statusCode
              label: 状态码
              value: 301
              options:
                - label: 301 永久重定向
                  value: 301
                - label: 302 临时重定向
                  value: 302
                - label: 307 临时重定向（保留请求方法）
                  value: 307
                - label: 308 永久重定向（保留请求方法）
                  value: 308
                - label: 410 已删除（不跳转）
                  value: 410
            - $formkit: text
              name: note
              label: 备注
              placeholder: 仅自己可见，例如：旧链接合并到新文章
